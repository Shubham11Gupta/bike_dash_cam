system:
  log_level: INFO

cameras:
  front:
    enabled: true
    source: ./videos/front_sample.mp4
    resolution: 1920x1080
    fps: 30

  rear:
    enabled: true
    source: ./videos/rear_sample.mp4
    resolution: 1920x1080
    fps: 30

recording:
  codec: h264
  segment_duration: 5

storage:
  max_usage_percent: 90
  recording_path: ./video_recordings